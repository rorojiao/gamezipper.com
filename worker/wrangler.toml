name = "gamezipper-wishes"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true

[vars]
WISH_ALLOWED_ORIGINS = "https://gamezipper.com,https://www.gamezipper.com"
WISH_ADMIN_URL = "https://gamezipper.com/admin/wishes/"
TURNSTILE_SITE_KEY = ""

[[d1_databases]]
binding = "DB"
database_name = "gamezipper-wishes"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
