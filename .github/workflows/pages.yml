name: Deploy to GitHub Pages

# ═══════════════════════════════════════════════════════════════════
# PLAN-D: Schedule-only deployment (2026-07-06)
# ═══════════════════════════════════════════════════════════════════
# This repo gets 100+ pushes/day from watchdog tunnel-rotation +
# dev pipeline. Every push triggering a deploy caused ~280 deploy
# attempts/day → GitHub Pages CDN "Deployment failed, try again later".
#
# STRATEGY: Deploy on a fixed schedule (every 2 hours) instead of on
# every push. Commits accumulate; the next scheduled run deploys the
# latest main. Max delay for content changes: 2 hours.
#
#   - gamezipper.com:  cron '7 */2 * * *'  (odd-offset to avoid overlap)
#   - gamezipper-tools: cron '37 */2 * * *' (30 min apart → no CDN conflict)
#
# Pushes NO LONGER trigger deploys. For urgent releases, use
# workflow_dispatch (Actions tab → Run workflow).
# ═══════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '7 */2 * * *'  # every 2 hours at minute 7
  workflow_dispatch:        # manual trigger for urgent releases

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      # 2026-10-09: repo crossed the actions/upload-pages-artifact@v3 10K-file / 1GB
      # hard limits. _optimization/ has 4405 files (dev QA closed-loop project, README
      # explicitly states "Phase 5 final report delivered"), test-library/ is 278M of
      # MASTER-TEST-CASES.md (not referenced from any HTML — internal QA history only),
      # and dotfile dirs (.audit/, .benchmarks/, .hermes*, .tools/, .well-known/, ...)
      # are dev/research artifacts that should not be served. Stage a clean copy of
      # the production site only.
      - name: Stage site (exclude dev-only paths)
        run: |
          mkdir -p _pages_stage
          rsync -a --exclude='_optimization' --exclude='_pages_stage' \
                    --exclude='.git' --exclude='.github' --exclude='node_modules' \
                    --exclude='test-library' \
                    --exclude='.audit' --exclude='.benchmarks' --exclude='.backup*' \
                    --exclude='.claude' --exclude='.cleanup' --exclude='.tools' \
                    --exclude='.hermes' --exclude='.hermes-refs' --exclude='.hermes-ux-rounds' \
                    --exclude='.well-known' --exclude='qa-round-4' \
                    --exclude='monkey-mart-ref' --exclude='_hermes' \
                    ./ _pages_stage/
          echo "staged file count:"
          find _pages_stage -type f | wc -l
          echo "staged size:"
          du -sh _pages_stage | cut -f1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_pages_stage'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    continue-on-error: true  # CDN conflicts are non-fatal
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          error_count: 30
          reporting_interval: 5000
          timeout: 600000
      - name: Retry on failure
        if: failure()
        uses: actions/deploy-pages@v4
        with:
          error_count: 30
          reporting_interval: 5000
          timeout: 600000
